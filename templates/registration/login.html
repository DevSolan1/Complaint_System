{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="cd-card p-4">
            <h3 class="mb-3">Log in</h3>
            {% if form.errors %}
                <div class="alert alert-danger">Your username and password didn't match. Please try again.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Username</label>
                    <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="id_password">Password</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn cd-btn-accent w-100">Log in</button>
            </form>
            <p class="mt-3 mb-0 text-muted">No account yet? <a href="{% url 'accounts:register' %}">Register here</a>.</p>
        </div>
    </div>
</div>
{% endblock %}
